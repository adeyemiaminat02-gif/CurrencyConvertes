services:
  - type: web
    name: currency-telegram-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: bot-redis
          property: connectionString

  - type: worker
    name: currency-bot-worker
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A tasks worker --loglevel=info
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: bot-redis
          property: connectionString

  - type: redis
    name: bot-redis
    plan: free
    ipAllowList: []
