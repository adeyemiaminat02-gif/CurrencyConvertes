services:
  - type: web
    name: currency-converter-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: EXCHANGE_API_KEY
        sync: false
      - key: BOT_USERNAME
        value: CurrencyConvertesbot
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./data/bot.db
      - key: DEFAULT_BASE
        value: USD
      - key: REQUEST_TIMEOUT
        value: "20"
      - key: LOG_LEVEL
        value: INFO
